[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scarline-io-client"
version = "0.1.0"
description = "SCARline host-native physical sensor service"
requires-python = ">=3.12"
dependencies = ["aio-pika==9.5.7", "PyYAML==6.0.2"]

[project.optional-dependencies]
camera = ["mediapipe==0.10.21", "opencv-python-headless==4.11.0.86"]
g29 = ["evdev==1.9.2; sys_platform == 'linux'"]
heart-rate = ["bleak==1.1.1", "pyserial==3.5"]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[project.scripts]
scarline-io-client = "scarline_io.__main__:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["scarline_io*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
