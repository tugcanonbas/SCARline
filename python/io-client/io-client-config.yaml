rabbitmq:
  host: rabbitmq
  port: 5672
  user: scarline
  password: scarline

sensors:
  - driver: logitech_g29
    enabled: true
    config:
      sample_rate: 100
      device_path: /dev/input/event0
      force_feedback: true
  - driver: usb_camera
    enabled: false
    config:
      sample_rate: 30
      device_index: 0
  - driver: eye_tracker
    enabled: true
    config:
      sample_rate: 10
      camera_index: 0
      ear_threshold: 0.21
      consec_frames: 2
  - driver: gaze
    enabled: true
    config:
      sample_rate: 10
      camera_index: 0
      shared_with: blink_detection

health_check:
  port: 8081
  interval: 10
