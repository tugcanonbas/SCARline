<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCARline - Logitech G29 Dashboard</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: #11111b; color: #cdd6f4; }
        h1 { margin-top: 0; color: #fab387; }
        .grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .panel { background: #181825; padding: 20px; border-radius: 8px; border: 1px solid #313244; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 360px; }
        .wheel-container { margin-bottom: 30px; position: relative; width: 150px; height: 150px; }
        .wheel { width: 150px; height: 150px; border: 10px solid #45475a; border-radius: 50%; box-sizing: border-box; position: absolute; transition: transform 0.05s linear; }
        .wheel::before { content: ''; position: absolute; top: -10px; left: 60px; width: 10px; height: 20px; background: #f38ba8; }
        .wheel::after { content: ''; position: absolute; top: 60px; left: -10px; width: 150px; height: 10px; background: #45475a; }
        .pedals { display: flex; gap: 40px; width: 100%; justify-content: center; }
        .bar-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .bar-bg { width: 40px; height: 120px; background: #313244; border-radius: 4px; position: relative; overflow: hidden; }
        .bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; transition: height 0.05s linear; }
        .throttle .bar-fill { background: #a6e3a1; }
        .brake .bar-fill { background: #f38ba8; }
        .label { font-size: 12px; color: #a6adc8; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-family: monospace; font-size: 14px; margin-top: 5px; }
        .log-container { background: #1e1e2e; border: 1px solid #313244; height: 400px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Logitech G29 Live Telemetry</h1>
    <div class="grid">
        <div class="panel">
            <div class="wheel-container">
                <div class="wheel" id="steeringWheel"></div>
            </div>
            <div class="val" id="steeringVal" style="margin-bottom: 20px;">0.00°</div>
            <div class="pedals">
                <div class="bar-container throttle">
                    <div class="bar-bg"><div class="bar-fill" id="throttleBar"></div></div>
                    <div class="label">Throttle</div>
                    <div class="val" id="throttleVal">0.00</div>
                </div>
                <div class="bar-container brake">
                    <div class="bar-bg"><div class="bar-fill" id="brakeBar"></div></div>
                    <div class="label">Brake</div>
                    <div class="val" id="brakeVal">0.00</div>
                </div>
            </div>
        </div>
        <div class="log-container" id="jsonLog"></div>
    </div>
    <script src="common.js"></script>
    <script>
        const steeringWheel = document.getElementById('steeringWheel');
        const steeringVal = document.getElementById('steeringVal');
        const throttleBar = document.getElementById('throttleBar');
        const throttleVal = document.getElementById('throttleVal');
        const brakeBar = document.getElementById('brakeBar');
        const brakeVal = document.getElementById('brakeVal');
        const jsonLog = document.getElementById('jsonLog');

        connectSCARline((message) => {
            if (message.routingKey && message.routingKey.includes('.steering')) {
                const p = message.payload;
                const degrees = (p.steeringAngle || 0) * 450;
                steeringWheel.style.transform = `rotate(${degrees}deg)`;
                steeringVal.textContent = degrees.toFixed(1) + '°';
                
                const throttle = p.throttle || 0;
                const brake = p.brake || 0;
                throttleBar.style.height = `${throttle * 100}%`;
                throttleVal.textContent = throttle.toFixed(2);
                
                brakeBar.style.height = `${brake * 100}%`;
                brakeVal.textContent = brake.toFixed(2);
                
                appendLog(jsonLog, p, 15);
            }
        });
    </script>
</body>
</html>
