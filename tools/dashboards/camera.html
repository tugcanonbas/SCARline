<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCARline - Camera Dashboard</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: #11111b; color: #cdd6f4; }
        h1 { margin-top: 0; color: #89b4fa; }
        .grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .video-container { background: #181825; padding: 10px; border-radius: 8px; border: 1px solid #313244; }
        img { width: 100%; border-radius: 4px; }
        .panel { background: #181825; padding: 20px; border-radius: 8px; border: 1px solid #313244; }
        .metric { font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #a6e3a1; }
        .label { font-size: 12px; color: #a6adc8; text-transform: uppercase; letter-spacing: 1px; }
        .log-container { background: #1e1e2e; border: 1px solid #313244; height: 300px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Camera Live Telemetry</h1>
    <div class="grid">
        <div class="video-container">
            <img src="http://localhost:8089/video_feed" alt="Live Camera Feed (Start demo_camera_server.py)" onerror="this.alt='Live feed unavailable. Run demo_camera_server.py'">
        </div>
        <div>
            <div class="panel">
                <div class="label">Eye Aspect Ratio (EAR)</div>
                <div class="metric" id="earVal">0.00</div>
                <div class="label">Blink Count</div>
                <div class="metric" id="blinkCount">0</div>
                <div class="label">Status</div>
                <div class="metric" id="statusStr" style="color:#a6e3a1;">EYES OPEN</div>
            </div>
            <div class="log-container" id="jsonLog"></div>
        </div>
    </div>
    <script src="common.js"></script>
    <script>
        const earVal = document.getElementById('earVal');
        const blinkCount = document.getElementById('blinkCount');
        const statusStr = document.getElementById('statusStr');
        const jsonLog = document.getElementById('jsonLog');

        connectSCARline((message) => {
            if (message.routingKey && message.routingKey.includes('.blink')) {
                const p = message.payload;
                earVal.textContent = p.eyeAspectRatio ? p.eyeAspectRatio.toFixed(3) : '0.00';
                blinkCount.textContent = p.blinkCount || 0;
                
                if (p.blinkDetected) {
                    statusStr.textContent = "BLINK DETECTED!";
                    statusStr.style.color = "#f9e2af";
                } else if (p.eyesClosed) {
                    statusStr.textContent = "EYES CLOSED";
                    statusStr.style.color = "#f38ba8";
                } else {
                    statusStr.textContent = "EYES OPEN";
                    statusStr.style.color = "#a6e3a1";
                }
                
                appendLog(jsonLog, p);
            }
        });
    </script>
</body>
</html>
