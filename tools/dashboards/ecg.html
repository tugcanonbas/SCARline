<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCARline - ECG Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: #11111b; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        h1 { margin-top: 0; color: #f38ba8; flex-shrink: 0; }
        .grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; flex: 1; min-height: 0; }
        .chart-container { background: #181825; padding: 20px; border-radius: 8px; border: 1px solid #313244; position: relative; display: flex; flex-direction: column; min-height: 0; }
        .chart-area { flex: 1; position: relative; min-height: 0; }
        .sidebar { display: flex; flex-direction: column; gap: 20px; min-height: 0; }
        .bpm-panel { background: #181825; padding: 20px; border-radius: 8px; border: 1px solid #313244; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bpm-value { font-size: 3.5rem; font-weight: bold; color: #f38ba8; line-height: 1; }
        .bpm-label { font-size: 0.85rem; color: #a6adc8; margin-top: 8px; text-transform: uppercase; letter-spacing: 2px; }
        .log-container { background: #1e1e2e; border: 1px solid #313244; flex: 1; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px; min-height: 0; }
        #status { position: absolute; top: 20px; right: 20px; font-weight: bold; color: #a6e3a1; z-index: 1; }
    </style>
</head>
<body>
    <h1>ECG Live Telemetry</h1>
    <div class="grid">
        <div class="chart-container">
            <div id="status">WAITING FOR DATA</div>
            <div class="chart-area">
                <canvas id="ecgChart"></canvas>
            </div>
        </div>
        <div class="sidebar">
            <div class="bpm-panel">
                <div class="bpm-value" id="bpmValue">—</div>
                <div class="bpm-label">BPM</div>
            </div>
            <div class="log-container" id="jsonLog"></div>
        </div>
    </div>
    <script src="common.js"></script>
    <script>
        const ctx = document.getElementById('ecgChart').getContext('2d');
        const statusEl = document.getElementById('status');
        const bpmValue = document.getElementById('bpmValue');
        const jsonLog = document.getElementById('jsonLog');

        const MAX_POINTS = 500;
        const ecgData = Array(MAX_POINTS).fill(0);
        const labels = Array(MAX_POINTS).fill('');

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'ECG Amplitude',
                    data: ecgData,
                    borderColor: '#00ff88',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { grid: { color: '#313244' }, ticks: { color: '#a6adc8' } }
                },
                plugins: { legend: { display: false } }
            }
        });

        connectSCARline((message) => {
            const rk = message.routingKey || '';
            const p = message.payload;

            if (rk.includes('.ecg')) {
                if (p.ecgSamples && p.ecgSamples.length > 0) {
                    p.ecgSamples.forEach(val => {
                        ecgData.shift();
                        ecgData.push(val);
                    });
                    chart.update();
                }

                statusEl.textContent = p.connected ? 'CONNECTED (500Hz)' : 'DEGRADED';
                statusEl.style.color = p.connected ? '#a6e3a1' : '#f38ba8';

                appendLog(jsonLog, p, 15);
            }

            if (rk.includes('.heart_rate') || rk.includes('io.heart_rate')) {
                if (p.heartRate != null) {
                    bpmValue.textContent = Math.round(p.heartRate);
                }
            }
        });
    </script>
</body>
</html>
