services:
  dev-deps:
    image: node:22-alpine
    working_dir: /workspace
    command: ["/bin/sh", "-c", "set -x && /usr/local/bin/npm install -g pnpm@latest && CI=true pnpm install --frozen-lockfile=false && pnpm --dir /workspace/packages/contracts build"]
    volumes:
      - .:/workspace
      - scarline-node-modules:/workspace/node_modules
      - scarline-contracts-node-modules:/workspace/packages/contracts/node_modules
      - scarline-core-api-node-modules:/workspace/services/core-api/node_modules
      - scarline-sim-bridge-node-modules:/workspace/services/sim-bridge/node_modules
      - scarline-admin-panel-node-modules:/workspace/apps/admin-panel/node_modules
      - scarline-overlay-web-node-modules:/workspace/apps/overlay-web/node_modules
    networks:
      - scarline-net

  core-api:
    extends:
      file: ./docker-compose.yml
      service: core-api
    depends_on:
      dev-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
    command: ["pnpm", "--dir", "/workspace/services/core-api", "dev"]
    volumes:
      - .:/workspace
      - scarline-node-modules:/workspace/node_modules
      - scarline-contracts-node-modules:/workspace/packages/contracts/node_modules
      - scarline-core-api-node-modules:/workspace/services/core-api/node_modules

  sim-bridge:
    extends:
      file: ./docker-compose.yml
      service: sim-bridge
    depends_on:
      dev-deps:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
    command: ["pnpm", "--dir", "/workspace/services/sim-bridge", "dev"]
    volumes:
      - .:/workspace
      - scarline-node-modules:/workspace/node_modules
      - scarline-contracts-node-modules:/workspace/packages/contracts/node_modules
      - scarline-sim-bridge-node-modules:/workspace/services/sim-bridge/node_modules

  admin-panel:
    extends:
      file: ./docker-compose.yml
      service: admin-panel
    depends_on:
      dev-deps:
        condition: service_completed_successfully
      core-api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PUBLIC_WS_URL: ws://localhost:${SCARLINE_PORT:-8088}/ws
    command: ["pnpm", "--dir", "/workspace/apps/admin-panel", "dev", "--host", "0.0.0.0", "--port", "3000"]
    volumes:
      - .:/workspace
      - scarline-node-modules:/workspace/node_modules
      - scarline-contracts-node-modules:/workspace/packages/contracts/node_modules
      - scarline-admin-panel-node-modules:/workspace/apps/admin-panel/node_modules

  overlay-web:
    extends:
      file: ./docker-compose.yml
      service: overlay-web
    depends_on:
      dev-deps:
        condition: service_completed_successfully
      core-api:
        condition: service_healthy
    environment:
      NODE_ENV: development
    command: ["pnpm", "--dir", "/workspace/apps/overlay-web", "dev"]
    volumes:
      - .:/workspace
      - scarline-node-modules:/workspace/node_modules
      - scarline-overlay-web-node-modules:/workspace/apps/overlay-web/node_modules

  docs:
    extends:
      file: ./docker-compose.yml
      service: docs
    build:
      context: .
      dockerfile: docs/Dockerfile
      target: build
    depends_on:
      dev-deps:
        condition: service_completed_successfully
    command: ["/bin/sh", "-c", "/usr/local/bin/npm install -g pnpm@latest && pnpm --dir /workspace/docs dev"]
    volumes:
      - .:/workspace
      - scarline-node-modules:/workspace/node_modules

  mock-simulator:
    extends:
      file: ./docker-compose.yml
      service: mock-simulator
    volumes:
      - .:/workspace

  carla-client:
    extends:
      file: ./docker-compose.yml
      service: carla-client
    volumes:
      - .:/workspace

  io-client:
    extends:
      file: ./docker-compose.yml
      service: io-client
    volumes:
      - .:/workspace
      - /dev:/dev

networks:
  scarline-net:
    driver: bridge

volumes:
  scarline-node-modules:
  scarline-contracts-node-modules:
  scarline-core-api-node-modules:
  scarline-sim-bridge-node-modules:
  scarline-admin-panel-node-modules:
  scarline-overlay-web-node-modules:
