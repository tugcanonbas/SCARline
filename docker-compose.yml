services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      admin-panel:
        condition: service_healthy
      core-api:
        condition: service_healthy
      overlay-web:
        condition: service_healthy
      docs:
        condition: service_healthy
    ports:
      - "${SCARLINE_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - scarline-net

  postgres:
    build:
      context: ./infra/database
      dockerfile: Dockerfile
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scarline}
      POSTGRES_USER: ${POSTGRES_USER:-scarline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scarline}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-scarline} -d ${POSTGRES_DB:-scarline}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - scarline-pgdata:/var/lib/postgresql/data
      - ./infra/database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/database/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - scarline-net

  schema-bootstrap:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scarline}:${POSTGRES_PASSWORD:-scarline}@postgres:5432/${POSTGRES_DB:-scarline}
    command: ["/bin/sh", "/workspace/infra/database/scripts/apply_schema.sh"]
    volumes:
      - .:/workspace
    networks:
      - scarline-net

  dev-seed:
    image: postgres:15
    profiles: ["dev"]
    depends_on:
      schema-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scarline}:${POSTGRES_PASSWORD:-scarline}@postgres:5432/${POSTGRES_DB:-scarline}
    command:
      - /bin/sh
      - -lc
      - psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /workspace/infra/database/seed/seed_dev.sql
    volumes:
      - .:/workspace
    networks:
      - scarline-net

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scarline}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-scarline}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"
    volumes:
      - scarline-rmqdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - scarline-net

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      schema-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-scarline}:${POSTGRES_PASSWORD:-scarline}@postgres:5432/${POSTGRES_DB:-scarline}
      AMQP_URL: amqp://${RABBITMQ_USER:-scarline}:${RABBITMQ_PASSWORD:-scarline}@rabbitmq:5672
      PM_SOCKET_PATH: ${PM_SOCKET_PATH:-/host-tmp/scarline.sock}
      SCARLINE_INTERNAL_API_TOKEN: ${SCARLINE_INTERNAL_API_TOKEN:-scarline-development-internal-token}
      SCARLINE_PORT: ${SCARLINE_PORT:-8088}
      WIDGETS_DIR: /workspace/widgets
      EXPORTS_DIR: /data/scarline/exports
    volumes:
      - /tmp:/host-tmp
      - ./.scarline-runtime/exports:/data/scarline/exports
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scarline-net

  sim-bridge:
    build:
      context: .
      dockerfile: services/sim-bridge/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9000
      AMQP_URL: amqp://${RABBITMQ_USER:-scarline}:${RABBITMQ_PASSWORD:-scarline}@rabbitmq:5672
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scarline-net

  admin-panel:
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      ORIGIN: http://localhost:${SCARLINE_PORT:-8088}
      PUBLIC_API_BASE: /api
      PUBLIC_DOCS_URL: ${PUBLIC_DOCS_URL:-/docs/}
      CORE_API_ORIGIN: http://core-api:8080/api
      PUBLIC_WS_URL: ws://localhost:${SCARLINE_PORT:-8088}/ws
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/admin/login || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scarline-net

  overlay-web:
    build:
      context: .
      dockerfile: apps/overlay-web/Dockerfile
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      PORT: 4000
      CORE_API_ORIGIN: ""
      PUBLIC_WS_URL: ws://localhost:${SCARLINE_PORT:-8088}/ws
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scarline-net

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4040/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scarline-net

  mock-simulator:
    build:
      context: .
      dockerfile: python/mock-simulator/Dockerfile
    depends_on:
      sim-bridge:
        condition: service_healthy
    environment:
      MOCK_SCENARIO: city_drive
      MOCK_HEALTH_PORT: 8082
      SIM_BRIDGE_URL: ws://sim-bridge:9000/adapter
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scarline-net

  carla-client:
    build:
      context: .
      dockerfile: python/carla-client/Dockerfile
    depends_on:
      sim-bridge:
        condition: service_healthy
    environment:
      SIM_BRIDGE_URL: ws://sim-bridge:9000/adapter
      CARLA_SERVER_HOST: host.docker.internal
      CARLA_SERVER_PORT: ${CARLA_SERVER_PORT:-2000}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - scarline-net

  io-client:
    build:
      context: .
      dockerfile: python/io-client/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      IO_CLIENT_CONFIG: /workspace/python/io-client/io-client-config.yaml
      IO_HEALTH_PORT: 8081
      AMQP_URL: amqp://${RABBITMQ_USER:-scarline}:${RABBITMQ_PASSWORD:-scarline}@rabbitmq:5672
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - /dev:/dev
    networks:
      - scarline-net

networks:
  scarline-net:
    driver: bridge

volumes:
  scarline-pgdata:
  scarline-rmqdata:
