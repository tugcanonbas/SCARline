<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Calendar</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="h-full w-full rounded-[28px] border border-white/10 bg-slate-950/70 p-5 text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]">
      <p class="text-xs uppercase tracking-[0.25em] text-slate-300">Calendar</p><h1 id="date" class="mt-2 text-3xl font-semibold">Today</h1>
      <div id="grid" class="mt-5 grid grid-cols-7 gap-2 text-center text-sm text-slate-300"></div>
      <div id="events" class="mt-5 space-y-2"></div>
    </div>
    <script>
      function drawDate(value){const date=value?new Date(value):new Date();document.getElementById('date').textContent=date.toLocaleDateString([], {month:'long',day:'numeric'});document.getElementById('grid').innerHTML=Array.from({length:35},(_,i)=>'<span class="rounded-lg '+(i+1===date.getDate()?'bg-sky-300 text-slate-950':'bg-white/5')+' py-1">'+(i+1)+'</span>').join('')}
      function drawEvents(items){document.getElementById('events').innerHTML=(Array.isArray(items)?items:[]).slice(0,3).map((e)=>'<div class="rounded-2xl bg-white/5 p-3"><p class="font-semibold">'+(e.title||'Event')+'</p><p class="text-sm text-slate-400">'+(e.time||'')+'</p></div>').join('')}
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('calendar.currentDate',drawDate);
        SCARline.onBinding('calendar.events',drawEvents);
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-sky-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        drawDate();drawEvents([]);SCARline.ready()}
      init();
    </script>
  </body>
</html>
