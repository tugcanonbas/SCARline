<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Outgoing Call</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}@keyframes dots{50%{opacity:.25}}</style></head>
  <body>
    <div id="card" class="grid h-full w-full place-items-center rounded-[32px] border border-sky-300/20 bg-slate-950/70 p-8 text-center text-white shadow-[0_24px_55px_rgba(0,0,0,.4)]">
      <div><p class="text-xs uppercase tracking-[0.25em] text-sky-200">Dialing</p><h1 id="name" class="mt-3 text-4xl font-semibold">Unknown</h1><p id="phone" class="mt-1 text-slate-300"></p><p id="duration" class="mt-6 text-lg text-sky-100" style="animation:dots 1s infinite">Calling 0s</p></div>
    </div>
    <script>
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('call.calleeName',(v)=>document.getElementById('name').textContent=v||'Unknown');
        SCARline.onBinding('call.calleePhone',(v)=>document.getElementById('phone').textContent=v||'');
        SCARline.onBinding('call.dialDuration',(v)=>document.getElementById('duration').textContent='Calling '+Math.round(v||0)+'s');
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-sky-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
