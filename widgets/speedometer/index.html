<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speedometer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root" class="flex h-full w-full items-center justify-center rounded-full border border-white/15 bg-slate-950/55 text-white shadow-[0_20px_40px_rgba(0,0,0,0.35)]">
      <div class="text-center">
        <p class="text-xs uppercase tracking-[0.25em] text-slate-400">Speed</p>
        <div class="mt-3 flex items-end justify-center gap-3">
          <span id="speed" class="text-7xl font-semibold tracking-tight">0</span>
          <span class="pb-2 text-xl text-slate-400">km/h</span>
        </div>
        <p id="limit" class="mt-3 text-sm text-slate-400">Limit 0</p>
      </div>
    </div>

    <script>
      const speedNode = document.getElementById('speed');
      const limitNode = document.getElementById('limit');
      let currentLimit = 0;

      function updateSpeed(value) {
        const rounded = Math.round(value ?? 0);
        speedNode.textContent = String(rounded);
        speedNode.className = rounded > currentLimit
          ? 'text-7xl font-semibold tracking-tight text-red-400'
          : 'text-7xl font-semibold tracking-tight';
      }

      function updateLimit(value) {
        currentLimit = Math.round(value ?? 0);
        limitNode.textContent = `Limit ${currentLimit}`;
      }

      function init() {
        if (typeof SCARline === 'undefined') {
          setTimeout(init, 50);
          return;
        }

        SCARline.onBinding('vehicle.speed', updateSpeed);
        SCARline.onBinding('vehicle.speedLimit', updateLimit);
        SCARline.onTrigger((event) => {
          if (event?.triggerType) {
            document.getElementById('root').classList.add('ring-4', 'ring-red-400/60');
          }
        });
        SCARline.onStateChange((state) => {
          document.body.style.opacity = state === 'hidden' ? '0' : '1';
        });
        SCARline.ready();
      }

      init();
    </script>
  </body>
</html>
