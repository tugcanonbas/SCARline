<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Active Call</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="flex h-full w-full flex-col justify-between rounded-[32px] border border-emerald-300/20 bg-slate-950/70 p-7 text-white shadow-[0_24px_55px_rgba(0,0,0,.4)]">
      <p class="text-xs uppercase tracking-[0.25em] text-emerald-200">Active Call</p>
      <div><h1 id="name" class="text-4xl font-semibold">Unknown</h1><p id="duration" class="mt-2 text-2xl text-slate-200">00:00</p></div>
      <p id="muted" class="rounded-full bg-white/10 px-4 py-2 text-center text-sm text-slate-300">Mic open</p>
    </div>
    <script>
      const fmt=(s)=>String(Math.floor((s||0)/60)).padStart(2,'0')+':'+String(Math.round((s||0)%60)).padStart(2,'0');
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('call.callerName',(v)=>document.getElementById('name').textContent=v||'Unknown');
        SCARline.onBinding('call.duration',(v)=>document.getElementById('duration').textContent=fmt(Number(v||0)));
        SCARline.onBinding('call.muted',(v)=>document.getElementById('muted').textContent=v?'Muted':'Mic open');
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-emerald-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
