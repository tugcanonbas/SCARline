<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Music Player</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="flex h-full w-full gap-5 rounded-[28px] border border-fuchsia-300/20 bg-slate-950/70 p-5 text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]">
      <div id="art" class="grid h-full aspect-square place-items-center rounded-3xl bg-fuchsia-300/20 text-3xl">M</div>
      <div class="flex min-w-0 flex-1 flex-col justify-center">
        <p id="state" class="text-xs uppercase tracking-[0.25em] text-fuchsia-200">Paused</p>
        <h1 id="track" class="truncate text-3xl font-semibold">No Track</h1>
        <p id="artist" class="truncate text-slate-300">Unknown Artist</p>
        <div class="mt-4 h-2 overflow-hidden rounded-full bg-white/10"><div id="bar" class="h-full rounded-full bg-fuchsia-300" style="width:0%"></div></div>
      </div>
    </div>
    <script>
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('music.trackName',(v)=>document.getElementById('track').textContent=v||'No Track');
        SCARline.onBinding('music.artistName',(v)=>document.getElementById('artist').textContent=v||'Unknown Artist');
        SCARline.onBinding('music.albumArt',(v)=>{if(v)document.getElementById('art').style.backgroundImage='url('+v+')'});
        SCARline.onBinding('music.isPlaying',(v)=>document.getElementById('state').textContent=v?'Playing':'Paused');
        SCARline.onBinding('music.progress',(v)=>document.getElementById('bar').style.width=Math.max(0,Math.min(100,Number(v||0)*100))+'%');
        SCARline.onBinding('music.duration',()=>{});
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-fuchsia-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
