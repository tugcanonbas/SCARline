<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Session Timeline</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="flex h-full w-full items-center gap-5 rounded-[24px] border border-indigo-300/20 bg-slate-950/70 px-5 text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]">
      <p id="time" class="text-3xl font-semibold">00:00</p>
      <div class="flex-1"><div class="flex justify-between text-xs uppercase tracking-[0.2em] text-indigo-200"><span id="phase">Session</span><span id="percent">0%</span></div><div class="mt-2 h-2 overflow-hidden rounded-full bg-white/10"><div id="bar" class="h-full rounded-full bg-indigo-300" style="width:0%"></div></div></div>
    </div>
    <script>
      let elapsed=0,total=0,progress=0;const fmt=(s)=>String(Math.floor((s||0)/60)).padStart(2,'0')+':'+String(Math.round((s||0)%60)).padStart(2,'0');function render(){const pct=progress||total?Math.min(100,Math.round((elapsed/total)*100)):0;document.getElementById('time').textContent=fmt(elapsed);document.getElementById('percent').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%'}
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('session.elapsedTime',(v)=>{elapsed=Number(v||0);render()});
        SCARline.onBinding('session.totalDuration',(v)=>{total=Number(v||0);render()});
        SCARline.onBinding('session.phase',(v)=>document.getElementById('phase').textContent=v||'Session');
        SCARline.onBinding('session.progress',(v)=>{progress=Number(v||0);render()});
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-indigo-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
