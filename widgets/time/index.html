<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="flex h-full w-full items-center justify-center rounded-[24px] border border-white/10 bg-slate-950/55 text-white shadow-[0_18px_40px_rgba(0,0,0,0.3)]">
      <div class="text-center">
        <p class="text-xs uppercase tracking-[0.25em] text-slate-400">System Time</p>
        <p id="clock" class="mt-3 text-4xl font-semibold tracking-tight">--:--</p>
      </div>
    </div>

    <script>
      const clockNode = document.getElementById('clock');

      function renderFallback() {
        clockNode.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function init() {
        renderFallback();
        setInterval(renderFallback, 1000);

        if (typeof SCARline === 'undefined') {
          setTimeout(init, 50);
          return;
        }

        SCARline.onBinding('clock.now', (value) => {
          if (value) {
            clockNode.textContent = value;
          }
        });
        SCARline.ready();
      }

      init();
    </script>
  </body>
</html>
