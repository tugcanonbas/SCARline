<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Respiratory Rate</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}@keyframes breathe{50%{transform:scaleY(.42)}}</style></head>
  <body>
    <div id="card" class="grid h-full w-full place-items-center rounded-[28px] border border-cyan-300/20 bg-slate-950/70 p-5 text-center text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]">
      <div class="w-full"><p class="text-xs uppercase tracking-[0.25em] text-cyan-200">Respiration</p><p class="mt-3 text-5xl font-semibold"><span id="rate">16</span></p><p class="text-slate-300">breaths/min</p><div id="wave" class="mx-auto mt-5 h-12 w-32 rounded-full bg-cyan-300/30" style="animation:breathe 2.5s infinite"></div></div>
    </div>
    <script>
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('health.resp.breathRate',(v)=>document.getElementById('rate').textContent=Math.round(v||0));
        SCARline.onBinding('health.resp.amplitude',(v)=>document.getElementById('wave').style.opacity=String(Math.max(.25,Math.min(1,Number(v||.5)))));
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-cyan-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
