<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Call Declined</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="grid h-full w-full place-items-center rounded-[28px] border border-red-300/20 bg-slate-950/70 p-5 text-center text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]">
      <div><p class="text-xs uppercase tracking-[0.25em] text-red-200">Call Declined</p><h1 id="name" class="mt-2 text-3xl font-semibold">Unknown</h1></div>
    </div>
    <script>
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('call.callerName',(v)=>document.getElementById('name').textContent=v||'Unknown');
        SCARline.onTrigger((event)=>{if(event?.action==='hide')document.body.style.opacity='0';else document.getElementById('card').classList.add('ring-4','ring-red-300/50')});
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
