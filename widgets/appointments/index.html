<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Appointments</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="h-full w-full rounded-[28px] border border-white/10 bg-slate-950/70 p-5 text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]"><p class="text-xs uppercase tracking-[0.25em] text-slate-300">Appointments</p><div id="list" class="mt-4 space-y-3"></div></div>
    <script>
      let items=[{title:'Design review',time:'09:30',location:'Lab A'}],next=0;function render(){document.getElementById('list').innerHTML=items.map((item,index)=>'<div class="rounded-2xl border '+(index===next?'border-amber-300/70 bg-amber-300/15':'border-white/10 bg-white/5')+' p-3"><p class="font-semibold">'+(item.title||'Appointment')+'</p><p class="text-sm text-slate-400">'+(item.time||'')+' '+(item.location||'')+'</p></div>').join('')}
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('appointments.list',(v)=>{items=Array.isArray(v)?v:items;render()});
        SCARline.onBinding('appointments.nextIndex',(v)=>{next=Number(v||0);render()});
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-amber-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        render();SCARline.ready()}
      init();
    </script>
  </body>
</html>
