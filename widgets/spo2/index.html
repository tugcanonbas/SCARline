<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SpO2</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="grid h-full w-full place-items-center rounded-full border border-blue-300/20 bg-slate-950/70 p-5 text-center text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]">
      <div><p class="text-xs uppercase tracking-[0.25em] text-blue-200">SpO2</p><p class="mt-3 text-6xl font-semibold"><span id="value">98</span>%</p><p id="status" class="mt-2 text-slate-300">normal</p></div>
    </div>
    <script>
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('health.spo2.percentage',(v)=>document.getElementById('value').textContent=Math.round(v||0));
        SCARline.onBinding('health.spo2.status',(v)=>document.getElementById('status').textContent=v||'normal');
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-blue-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
