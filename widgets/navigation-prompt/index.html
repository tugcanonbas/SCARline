<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Prompt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="card" class="h-full w-full rounded-[28px] border border-cyan-300/20 bg-slate-950/60 p-6 text-white shadow-[0_20px_40px_rgba(0,0,0,0.35)]">
      <p class="text-xs uppercase tracking-[0.25em] text-cyan-300">Next Maneuver</p>
      <h2 id="instruction" class="mt-5 text-3xl font-semibold tracking-tight">Continue straight</h2>
      <p id="distance" class="mt-3 text-lg text-slate-300">0 m</p>
    </div>

    <script>
      function init() {
        if (typeof SCARline === 'undefined') {
          setTimeout(init, 50);
          return;
        }

        SCARline.onBinding('instruction', (value) => {
          document.getElementById('instruction').textContent = value || 'Continue straight';
        });
        SCARline.onBinding('distance', (value) => {
          document.getElementById('distance').textContent = `${Math.round(value || 0)} m`;
        });
        SCARline.onTrigger(() => {
          document.getElementById('card').classList.add('ring-4', 'ring-cyan-300/40');
        });
        SCARline.ready();
      }

      init();
    </script>
  </body>
</html>
