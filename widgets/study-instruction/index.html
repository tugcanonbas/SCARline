<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Study Instruction</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="flex h-full w-full flex-col justify-between rounded-[32px] border border-amber-300/20 bg-slate-950/75 p-7 text-white shadow-[0_24px_55px_rgba(0,0,0,.4)]">
      <div><p id="priority" class="text-xs uppercase tracking-[0.25em] text-amber-200">Instruction</p><h1 id="title" class="mt-3 text-4xl font-semibold">Study Task</h1><p id="body" class="mt-4 text-xl leading-relaxed text-slate-200">Wait for the researcher instruction.</p></div>
      <p id="step" class="text-sm text-slate-400">Step 1</p>
    </div>
    <script>
      let step=1,total=0;function renderStep(){document.getElementById('step').textContent='Step '+step+(total?'/'+total:'')}
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('study.instruction.title',(v)=>document.getElementById('title').textContent=v||'Study Task');
        SCARline.onBinding('study.instruction.body',(v)=>document.getElementById('body').textContent=v||'');
        SCARline.onBinding('study.instruction.step',(v)=>{step=Math.round(v||1);renderStep()});
        SCARline.onBinding('study.instruction.totalSteps',(v)=>{total=Math.round(v||0);renderStep()});
        SCARline.onBinding('study.instruction.priority',(v)=>document.getElementById('priority').textContent=v||'Instruction');
        SCARline.onTrigger(()=>document.getElementById('card').classList.add('ring-4','ring-amber-300/50'));
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
