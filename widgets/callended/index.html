<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Call Ended</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}</style></head>
  <body>
    <div id="card" class="flex h-full w-full items-center justify-between rounded-[28px] border border-white/10 bg-slate-950/70 p-6 text-white shadow-[0_20px_45px_rgba(0,0,0,.35)]">
      <div><p class="text-xs uppercase tracking-[0.25em] text-slate-300">Call Ended</p><h1 id="name" class="mt-2 text-3xl font-semibold">Unknown</h1><p id="reason" class="mt-1 text-slate-400">completed</p></div>
      <p id="duration" class="text-3xl font-semibold">00:00</p>
    </div>
    <script>
      const fmt=(s)=>String(Math.floor((s||0)/60)).padStart(2,'0')+':'+String(Math.round((s||0)%60)).padStart(2,'0');
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('call.callerName',(v)=>document.getElementById('name').textContent=v||'Unknown');
        SCARline.onBinding('call.totalDuration',(v)=>document.getElementById('duration').textContent=fmt(Number(v||0)));
        SCARline.onBinding('call.endReason',(v)=>document.getElementById('reason').textContent=v||'completed');
        SCARline.onTrigger((event)=>{if(event?.action==='hide')document.body.style.opacity='0'});
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
