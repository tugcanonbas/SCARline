<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Incoming Call</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:transparent}@keyframes pulse{50%{transform:scale(1.05);opacity:.72}}</style></head>
  <body>
    <div id="card" class="grid h-full w-full place-items-center rounded-[32px] border border-emerald-300/20 bg-slate-950/70 p-8 text-center text-white shadow-[0_24px_55px_rgba(0,0,0,.4)]">
      <div>
        <div class="mx-auto grid h-24 w-24 place-items-center rounded-full bg-emerald-300/20 text-4xl font-semibold" style="animation:pulse 1.2s infinite">CALL</div>
        <p class="mt-5 text-xs uppercase tracking-[0.25em] text-emerald-200">Incoming Call</p>
        <h1 id="name" class="mt-2 text-4xl font-semibold">Unknown</h1>
        <p id="phone" class="mt-1 text-slate-300"></p>
        <p id="duration" class="mt-4 text-sm text-slate-400">Ringing 0s</p>
      </div>
    </div>
    <script>
      function init(){if(typeof SCARline==='undefined'){setTimeout(init,50);return}
        SCARline.onBinding('call.callerName',(v)=>document.getElementById('name').textContent=v||'Unknown');
        SCARline.onBinding('call.callerPhone',(v)=>document.getElementById('phone').textContent=v||'');
        SCARline.onBinding('call.callerAvatar',()=>{});
        SCARline.onBinding('call.ringDuration',(v)=>document.getElementById('duration').textContent='Ringing '+Math.round(v||0)+'s');
        SCARline.onTrigger((event)=>{if(event?.action==='hide')document.body.style.opacity='0';else document.getElementById('card').classList.add('ring-4','ring-emerald-300/50')});
        SCARline.onStateChange((state)=>{document.body.style.opacity=state==='hidden'?'0':'1'});
        SCARline.ready()}
      init();
    </script>
  </body>
</html>
