<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Controls</title>
  <link rel="stylesheet" href="../../dist.css" />
  <style>
    body { font-family: "Inter", sans-serif; background: transparent; }
  </style>
</head>
<body class="m-0 min-h-screen bg-transparent flex items-start justify-start">
  <section class="w-[316px] h-[129px] rounded-2xl border border-rose-300/15 bg-[#1a1014]/92 text-white shadow-2xl backdrop-blur-md p-5 flex flex-col justify-between">
    <div class="flex items-center justify-between gap-4">
      <div class="text-[11px] uppercase tracking-[0.22em] text-rose-200">Operator Controls</div>
      <div class="rounded-full border border-white/10 px-3 py-1 text-[11px] text-white/65" data-bind="controls.runtime_state">running</div>
    </div>
    <div class="grid grid-cols-3 gap-3">
      <button type="button" class="rounded-xl border border-white/10 bg-white/5 px-3 py-3 text-sm font-medium" data-bind="controls.primary_label">Pause Session</button>
      <button type="button" class="rounded-xl border border-white/10 bg-white/5 px-3 py-3 text-sm font-medium" data-bind="controls.secondary_label">Mark Event</button>
      <button type="button" class="rounded-xl border border-white/10 bg-white/5 px-3 py-3 text-sm font-medium" data-bind="controls.tertiary_label">Recover Runtime</button>
    </div>
  </section>
</body>
</html>
