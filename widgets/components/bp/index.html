<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background - Scaled down pattern */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

    </style>
</head>

<body class="m-0 h-screen w-full overflow-hidden bg-transparent">

    <!-- Card Container: 95x65 -->
    <!-- Card Container: 95x65 -->
    <div data-scarline-widget-root
        class="bg-[#686d76] w-full h-full rounded-lg overflow-hidden shadow-md relative text-white flex p-1.5 isolate">
        <!-- Added isolate for z-index context -->

        <!-- Grid Background Overlay -->
        <div class="absolute inset-0 bg-grid pointer-events-none opacity-50 z-0"></div>

        <!-- Waveform (Left, larger and centered vertically) -->
        <div
            class="absolute left-0 top-0 bottom-0 w-[40%] text-red-500 opacity-80 z-0 flex items-center overflow-hidden">
            <svg data-chart="vitals.blood_pressure_systolic" data-chart-secondary="vitals.blood_pressure_diastolic" data-chart-window="60" viewBox="0 0 240 60" preserveAspectRatio="none" role="img" aria-label="Blood pressure trend" style="width:100%;height:100%;overflow:hidden">
                    <title>Blood pressure trend</title>
                    <path data-chart-trace fill="none" stroke="#ef4444" stroke-width="1.5" vector-effect="non-scaling-stroke" />
                </svg>
        </div>

        <!-- Main Value (Right, with background to 'cut off' the wave) -->
        <div
            class="absolute right-0 top-0 bottom-0 w-[55%] flex flex-col items-end justify-center z-10 bg-gradient-to-l from-[#686d76] via-[#686d76] to-transparent pr-1.5 pl-4">
            <div class="text-[8px] font-medium text-white/60 leading-none mb-0.5"
                data-bind="vitals.blood_pressure_unit">
                mmHg
            </div>
            <div class="text-xl font-bold text-white tracking-tight leading-[0.85] text-right">
                <span aria-label="Systolic" data-bind="vitals.blood_pressure_systolic" data-format="number"
                    data-decimals="0">—</span><br><span class="text-lg" aria-label="Diastolic" data-bind="vitals.blood_pressure_diastolic"
                    data-format="number" data-decimals="0">—</span>
            </div>
        </div>

    </div>
    <script src="../../widget-runtime.js"></script>
</body>

</html>
