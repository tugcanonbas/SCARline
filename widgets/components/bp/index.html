<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background - Scaled down pattern */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        @keyframes wave-scroll {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        .wave-marquee {
            --wave-duration: 1.45s;
            animation: wave-scroll var(--wave-duration) linear infinite;
            will-change: transform;
        }

        .wave-trace {
            --wave-scale: 1;
            transform-box: fill-box;
            transform-origin: center;
            transform: scaleY(var(--wave-scale));
            transition: transform 0.3s ease-out;
        }
    </style>
</head>

<body class="m-0 h-screen w-full overflow-hidden bg-transparent">

    <!-- Card Container: 95x65 -->
    <!-- Card Container: 95x65 -->
    <div data-scarline-widget-root
        class="bg-transparent w-full h-full rounded-lg overflow-hidden shadow-md relative text-white flex p-1.5 isolate">
        <!-- Added isolate for z-index context -->



        <!-- Waveform (Left, larger and centered vertically) -->
        <div
            class="absolute left-0 top-0 bottom-0 w-[70%] text-red-500 opacity-80 z-0 flex items-center overflow-hidden">
            <div class="flex h-full w-[200%] wave-marquee" data-bind="vitals.blood_pressure_wave_duration"
                data-bind-style="--wave-duration" data-style-unit="s" data-bind-text="false">
                <svg class="w-1/2 h-full shrink-0" preserveAspectRatio="none"
                    data-bind="vitals.blood_pressure_wave_scale" data-bind-style="--wave-scale" data-bind-text="false">
                    <path class="wave-trace"
                        d="M0,45 Q5,45 8,30 T15,45 Q20,45 23,25 T30,45 Q35,45 38,30 T45,45 Q50,45 53,25 T60,45 Q65,45 68,30 T75,45 H100"
                        stroke="currentColor" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke" />
                </svg>
                <svg class="w-1/2 h-full shrink-0" preserveAspectRatio="none"
                    data-bind="vitals.blood_pressure_wave_scale" data-bind-style="--wave-scale" data-bind-text="false">
                    <path class="wave-trace"
                        d="M0,45 Q5,45 8,30 T15,45 Q20,45 23,25 T30,45 Q35,45 38,30 T45,45 Q50,45 53,25 T60,45 Q65,45 68,30 T75,45 H100"
                        stroke="currentColor" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke" />
                </svg>
            </div>
        </div>

        <!-- Main Value (Right, with background to 'cut off' the wave) -->
        <div
            class="absolute right-0 top-0 bottom-0 w-[55%] flex flex-col items-end justify-center z-10 bg-gradient-to-l from-[#686d76] via-[#686d76] to-transparent pr-1.5 pl-4">
            <div class="text-[8px] font-medium text-white/60 leading-none mb-0.5"
                data-bind="vitals.blood_pressure_unit">
                mmHg
            </div>
            <div class="text-xl font-bold text-white tracking-tight leading-[0.85] text-right">
                <span data-bind="vitals.blood_pressure_diastolic" data-format="number"
                    data-decimals="0">78</span><br><span class="text-lg" data-bind="vitals.blood_pressure_systolic"
                    data-format="number" data-decimals="0">123</span>
            </div>
        </div>

    </div>
    <script src="../../widget-runtime.js"></script>
</body>

</html>
