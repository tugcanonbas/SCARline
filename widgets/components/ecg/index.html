<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background */
        .bg-grid {
            background-size: 20px 20px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        @keyframes wave-scroll {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        .wave-marquee {
            --wave-duration: 1.35s;
            animation: wave-scroll var(--wave-duration) linear infinite;
            will-change: transform;
        }

        .wave-trace {
            --wave-scale: 1;
            transform-box: fill-box;
            transform-origin: center;
            transform: scaleY(var(--wave-scale));
            transition: transform 0.3s ease-out;
        }
    </style>
</head>

<body class="bg-transparent min-h-screen flex items-center justify-center p-4">

    <!-- Card Container (Size constrained by meta.json 316x197 in production, but handled by Tailwind here) -->

        class="bg-transparent w-[316px] h-[197px] rounded-2xl overflow-hidden shadow-2xl relative text-white flex flex-col">

        <!-- Grid Background Overlay -->
        <div class="absolute inset-0 bg-grid pointer-events-none"></div>

                            class="wave-trace drop-shadow-[0_0_2px_rgba(34,197,94,0.5)]" />
                        <path
                            d="M110,25 L120,25 L125,10 L130,40 L135,5 L140,30 L150,25 L160,25 L170,25 L180,25 L185,10 L190,40 L195,5 L200,30 L210,25 L220,25 L230,25 L235,10 L240,40 L245,5 L250,30 L260,25"
                            stroke="#22c55e" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"

                    </svg>
                    <svg class="w-1/2 h-full shrink-0" preserveAspectRatio="none"

                        <path
                            d="M0,25 L10,25 L15,10 L20,40 L25,5 L30,30 L40,25 L50,25 L60,25 L70,25 L75,10 L80,40 L85,5 L90,30 L100,25 L110,25"
                            stroke="#22c55e" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"
                            class="wave-trace drop-shadow-[0_0_2px_rgba(34,197,94,0.5)]" />
                        <path
                            d="M110,25 L120,25 L125,10 L130,40 L135,5 L140,30 L150,25 L160,25 L170,25 L180,25 L185,10 L190,40 L195,5 L200,30 L210,25 L220,25 L230,25 L235,10 L240,40 L245,5 L250,30 L260,25"
                            stroke="#22c55e" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"
                            class="wave-trace drop-shadow-[0_0_2px_rgba(34,197,94,0.5)]" />

            <!-- Data -->

                <div class="text-[6px] text-green-400/80 w-full text-left pl-1 truncate" data-bind="vitals.ecg_status">

                <div class="text-[6px] text-green-500 w-full text-left pl-1 -mt-1" data-bind="vitals.unit">bpm</div>
                <div class="text-2xl font-bold text-green-500 leading-none tracking-tighter"

        </div>

                            stroke="#ef4444" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"
                            class="wave-trace drop-shadow-[0_0_2px_rgba(239,68,68,0.5)]" />
                    </svg>

            </div>
            <!-- Data -->
            <div class="w-16 border-l border-white/10 flex flex-col justify-right items-end pr-2 bg-black/10">
                <div class="text-[8px] font-bold text-red-500 w-full text-left pl-1">NIBP</div>
                <div class="text-[6px] text-red-500 w-full text-left pl-1 -mt-1" data-bind="vitals.blood_pressure_unit">
                    mmHg</div>
                <div class="text-l font-bold text-red-500 leading-none text-right"><span

        <!-- 3. SPO2 Section (Blue) -->
        <div class="h-[49.25px] shrink-0 flex border-b border-white/10 relative">
            <!-- Waveform -->
            <div class="flex-1 relative overflow-hidden">
                <div class="absolute inset-0 flex h-full w-[200%] wave-marquee" data-bind="vitals.spo2_wave_duration"
                    data-bind-style="--wave-duration" data-style-unit="s" data-bind-text="false">
                    <svg class="w-1/2 h-full shrink-0" preserveAspectRatio="none" data-bind="vitals.spo2_wave_scale"

                            stroke="#38bdf8" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"

                    </svg>
                    <svg class="w-1/2 h-full shrink-0" preserveAspectRatio="none" data-bind="vitals.spo2_wave_scale"
                        data-bind-style="--wave-scale" data-bind-text="false">
                        <path
                            d="M0,30 C10,30 10,10 25,10 S40,30 50,30 S60,10 75,10 S90,30 100,30 S110,10 125,10 S140,30 150,30 S160,10 175,10 S190,30 200,30 S210,10 225,10 S240,30 250,30"
                            stroke="#38bdf8" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"
                            class="wave-trace drop-shadow-[0_0_2px_rgba(56,189,248,0.5)]" />
                    </svg>
                </div>
            </div>
            <!-- Data -->
            <div class="w-16 border-l border-white/10 flex flex-col justify-center items-end pr-2 bg-black/10">

        </div>

        <!-- 4. RESP Section (White/Grey) -->
        <div class="h-[49.25px] shrink-0 flex relative">
            <!-- Waveform -->
            <div class="flex-1 relative overflow-hidden">
                <div class="absolute inset-0 flex h-full w-[200%] wave-marquee"
                    data-bind="vitals.respiration_wave_duration" data-bind-style="--wave-duration" data-style-unit="s"
                    data-bind-text="false">
                    <svg class="w-1/2 h-full shrink-0" preserveAspectRatio="none"
                        data-bind="vitals.respiration_wave_scale" data-bind-style="--wave-scale" data-bind-text="false">
                        <path
                            d="M0,40 L20,30 L40,40 L60,20 L80,40 L100,35 L120,40 L140,25 L160,40 L180,30 L200,40 L220,15 L240,40"
                            stroke="#d1d5db" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"

                    </svg>
                    <svg class="w-1/2 h-full shrink-0" preserveAspectRatio="none"
                        data-bind="vitals.respiration_wave_scale" data-bind-style="--wave-scale" data-bind-text="false">
                        <path
                            d="M0,40 L20,30 L40,40 L60,20 L80,40 L100,35 L120,40 L140,25 L160,40 L180,30 L200,40 L220,15 L240,40"
                            stroke="#d1d5db" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"

            <!-- Data -->
            <div class="w-16 border-l border-white/10 flex flex-col justify-center items-end pr-2 bg-black/10">

                <div class="text-[6px] text-gray-300 w-full text-left pl-1 -mt-1" data-bind="vitals.respiration_unit">
                    rpm</div>
                <div class="text-2xl font-bold text-gray-300 leading-none" data-bind="vitals.respiration_rate"
                    data-format="number" data-decimals="0">18</div>
            </div>
        </div>

    </div>


    <script>
        (function initSCARlineWidget() {
            const WIDGET_RUNTIME_MARKER = 'scarline-widget-runtime';

            function formatValue(element, value) {
                if (value === undefined || value === null) return null;
                if (element?.dataset?.format === 'number') {
                    const decimals = Number(element.dataset.decimals ?? '0');
                    const numeric = Number(value);
                    if (!Number.isNaN(numeric)) {
                        return numeric.toFixed(decimals);
                    }
                }
                return String(value);
            }

            function toggleClassTokens(element, classNames, enabled) {
                const tokens = String(classNames ?? '')
                    .split(/\s+/)
                    .map((token) => token.trim())
                    .filter(Boolean);
                if (tokens.length === 0) return;
                if (enabled) {
                    element.classList.add(...tokens);
                } else {
                    element.classList.remove(...tokens);
                }
            }

            function applyBinding(key, value) {
                document.querySelectorAll('[data-bind]').forEach((element) => {
                    if (element.dataset.bind !== key) return;

                    if (element.dataset.bindClass) {
                        const className = element.dataset.bindClass;
                        const falseClassName = element.dataset.bindClassFalse;
                        if (value) {
                            toggleClassTokens(element, className, true);
                            if (falseClassName) toggleClassTokens(element, falseClassName, false);
                        } else {
                            toggleClassTokens(element, className, false);
                            if (falseClassName) toggleClassTokens(element, falseClassName, true);
                        }
                    }

                    if (element.dataset.bindStyle) {
                        const styleName = element.dataset.bindStyle;
                        const unit = element.dataset.styleUnit ?? '';
                        element.style.setProperty(styleName, `${value}${unit}`);
                    }

                    if (element.dataset.bindAttr) {
                        const attrName = element.dataset.bindAttr;
                        const formatted = formatValue(element, value);
                        if (formatted !== null) element.setAttribute(attrName, formatted);
                    }

                    if (element.dataset.bindText !== 'false') {
                        const formatted = formatValue(element, value);
                        if (formatted !== null) element.textContent = formatted;
                    }
                });
            }

            function setVisualState(nextState) {
                const root = document.body.firstElementChild;
                if (!root) return;
                root.dataset.state = nextState;
                root.style.opacity = nextState === 'hidden' ? '0' : '1';
                root.style.filter = nextState === 'highlighted' ? 'drop-shadow(0 0 24px rgba(56, 189, 248, 0.85))' : 'none';
                root.style.transform = nextState === 'highlighted' ? 'scale(1.015)' : 'scale(1)';
                root.style.transition = 'opacity 180ms ease, filter 180ms ease, transform 180ms ease';
            }

            function bindWidget() {
                if (!window.SCARline || document.body.dataset[WIDGET_RUNTIME_MARKER] === 'ready') {
                    return;
                }
                document.body.dataset[WIDGET_RUNTIME_MARKER] = 'ready';

                const keys = [...new Set(
                    Array.from(document.querySelectorAll('[data-bind]'))
                        .map((element) => element.dataset.bind)
                        .filter(Boolean)
                )];

                keys.forEach((key) => {
                    window.SCARline.onBinding(key, (value) => applyBinding(key, value));
                    const currentValue = window.SCARline.getBinding(key);
                    if (typeof currentValue !== 'undefined') {
                        applyBinding(key, currentValue);
                    }
                });

                document.querySelectorAll('[data-action]').forEach((element) => {
                    element.addEventListener('click', () => {
                        const action = element.dataset.action;
                        if (!action) return;
                        window.SCARline.send(action, {
                            action,
                            label: element.textContent?.trim() || null
                        });
                    });
                });

                window.SCARline.onTrigger((event) => {
                    const bindingValues = event?.bindingValues ?? event?.payload?.bindingValues ?? {};
                    Object.entries(bindingValues).forEach(([key, value]) => applyBinding(key, value));
                    if (event?.action === 'highlight') {
                        setVisualState('highlighted');
                    } else if (event?.action === 'hide') {
                        setVisualState('hidden');
                    } else if (event?.action === 'show' || event?.action === 'reset') {
                        setVisualState('visible');
                    }
                });

                window.SCARline.onStateChange((state) => {
                    setVisualState(state);
                });

                window.SCARline.ready();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bindWidget, { once: true });
            } else {
                bindWidget();
            }
        })();
    </script>
</body>

</html>
