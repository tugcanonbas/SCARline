<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background */
        .bg-grid {
            background-size: 20px 20px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

    </style>
</head>

<body class="m-0 h-screen w-full overflow-hidden bg-transparent">

    <!-- Card Container (Size constrained by meta.json 316x197 in production, but handled by Tailwind here) -->
    <div data-scarline-widget-root
        class="bg-[#686d76] w-full h-full rounded-2xl overflow-hidden shadow-2xl relative text-white flex flex-col">

        <!-- Grid Background Overlay -->
        <div class="absolute inset-0 bg-grid pointer-events-none"></div>

        <!-- 1. ECG Section (Green) -->
        <div class="h-[49.25px] shrink-0 flex border-b border-white/10 relative">
            <!-- Waveform -->
            <div class="flex-1 relative overflow-hidden">
                <svg data-chart="vitals.ecg_samples" data-chart-window="8" viewBox="0 0 240 60" preserveAspectRatio="none" role="img" aria-label="ECG samples" style="width:100%;height:100%;overflow:hidden">
                    <title>ECG samples</title>
                    <path data-chart-trace fill="none" stroke="#22c55e" stroke-width="1.5" vector-effect="non-scaling-stroke" />
                </svg>
            </div>
            <!-- Data -->
            <div class="w-16 border-l border-white/10 flex flex-col justify-center items-end pr-2 bg-black/10">
                <div class="text-[8px] font-bold text-green-500 w-full text-left pl-1 -mt-1">ECG <span
                        class="float-right text-[6px] opacity-70">♥</span></div>
                <div class="text-[6px] text-green-400/80 w-full text-left pl-1 truncate" data-bind="vitals.ecg_status">—</div>
                <div class="text-[6px] text-green-500 w-full text-left pl-1 -mt-1" data-bind="vitals.unit">bpm</div>
                <div class="text-2xl font-bold text-green-500 leading-none tracking-tighter"
                    data-bind="vitals.heart_rate" data-format="number" data-decimals="0">—</div>
            </div>
        </div>

        <!-- 2. NIBP Section (Red) -->
        <div class="h-[49.25px] shrink-0 flex border-b border-white/10 relative">
            <!-- Waveform -->
            <div class="flex-1 relative overflow-hidden">
                <svg data-chart="vitals.blood_pressure_systolic" data-chart-secondary="vitals.blood_pressure_diastolic" data-chart-window="60" viewBox="0 0 240 60" preserveAspectRatio="none" role="img" aria-label="Blood pressure trend" style="width:100%;height:100%;overflow:hidden">
                    <title>Blood pressure trend</title>
                    <path data-chart-trace fill="none" stroke="#ef4444" stroke-width="1.5" vector-effect="non-scaling-stroke" />
                </svg>
            </div>
            <!-- Data -->
            <div class="w-16 border-l border-white/10 flex flex-col justify-right items-end pr-2 bg-black/10">
                <div class="text-[8px] font-bold text-red-500 w-full text-left pl-1">NIBP</div>
                <div class="text-[6px] text-red-500 w-full text-left pl-1 -mt-1" data-bind="vitals.blood_pressure_unit">
                    mmHg</div>
                <div class="text-l font-bold text-red-500 leading-none text-right"><span
                        aria-label="Systolic" data-bind="vitals.blood_pressure_systolic" data-format="number"
                        data-decimals="0">—</span><br><span aria-label="Diastolic" data-bind="vitals.blood_pressure_diastolic"
                        data-format="number" data-decimals="0">—</span></div>
            </div>
        </div>

        <!-- 3. SPO2 Section (Blue) -->
        <div class="h-[49.25px] shrink-0 flex border-b border-white/10 relative">
            <!-- Waveform -->
            <div class="flex-1 relative overflow-hidden">
                <svg data-chart="vitals.spo2" data-chart-window="60" viewBox="0 0 240 60" preserveAspectRatio="none" role="img" aria-label="SpO2 trend" style="width:100%;height:100%;overflow:hidden">
                    <title>SpO2 trend</title>
                    <path data-chart-trace fill="none" stroke="#38bdf8" stroke-width="1.5" vector-effect="non-scaling-stroke" />
                </svg>
            </div>
            <!-- Data -->
            <div class="w-16 border-l border-white/10 flex flex-col justify-center items-end pr-2 bg-black/10">
                <div class="text-[8px] font-bold text-sky-400 w-full text-left pl-1">SPO2</div>
                <div class="text-[6px] text-sky-400 w-full text-left pl-1 -mt-1" data-bind="vitals.spo2_unit">%</div>
                <div class="text-2xl font-bold text-sky-400 leading-none" data-bind="vitals.spo2" data-format="number"
                    data-decimals="0">—</div>
            </div>
        </div>

        <!-- 4. RESP Section (White/Grey) -->
        <div class="h-[49.25px] shrink-0 flex relative">
            <!-- Waveform -->
            <div class="flex-1 relative overflow-hidden">
                <svg data-chart="vitals.respiration_rate" data-chart-window="60" viewBox="0 0 240 60" preserveAspectRatio="none" role="img" aria-label="Respiration trend" style="width:100%;height:100%;overflow:hidden">
                    <title>Respiration trend</title>
                    <path data-chart-trace fill="none" stroke="#d1d5db" stroke-width="1.5" vector-effect="non-scaling-stroke" />
                </svg>
            </div>
            <!-- Data -->
            <div class="w-16 border-l border-white/10 flex flex-col justify-center items-end pr-2 bg-black/10">
                <div class="text-[8px] font-bold text-gray-300 w-full text-left pl-1">RESP</div>
                <div class="text-[6px] text-gray-300 w-full text-left pl-1 -mt-1" data-bind="vitals.respiration_unit">
                    rpm</div>
                <div class="text-2xl font-bold text-gray-300 leading-none" data-bind="vitals.respiration_rate"
                    data-format="number" data-decimals="0">—</div>
            </div>
        </div>

    </div>
    <script src="../../widget-runtime.js"></script>
</body>

</html>
