<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Ended</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background - Scaled down pattern */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        /* Slow flash animation */
        @keyframes flash {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .animate-flash {
            animation: flash 2s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container: 150x197 -->
    <div
        class="bg-[#686d76] w-[150px] h-[197px] rounded-lg overflow-hidden shadow-md relative text-white flex flex-col items-center p-1 isolate">

        <!-- Grid Background Overlay -->
        <div class="absolute inset-0 bg-grid pointer-events-none opacity-50 z-0"></div>

        <!-- Caller Info -->
        <div class="relative z-10 flex flex-col items-center mt-1 w-full">
            <!-- Avatar -->
            <div class="w-12 h-12 rounded-full overflow-hidden mb-1">
                <img id="caller-avatar" src="../../images/avatars/susan-smith.png" alt="Caller"
                    class="w-full h-full object-cover">
            </div>
            <!-- Name -->
            <div id="caller-name" class="text-[12px] font-semibold tracking-tight text-white leading-tight"
                data-bind="call.caller_name">
                Susan Smith
            </div>
            <!-- Phone Number -->
            <div id="caller-phone" class="text-[9px] font-medium text-white/50 tracking-wide mt-0.5"
                data-bind="call.caller_phone">
                +49 1234 567890
            </div>
            <!-- Call Ended text -->
            <div class="text-[8px] font-medium text-red-400 tracking-wide mt-1 animate-flash" data-bind="call.status_label">
                Call Ended
            </div>
            <!-- Call Duration -->
            <div id="call-duration" class="text-[9px] font-medium text-white/60 tracking-wide" data-bind="call.duration_label">
                00:00
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="relative z-10 flex items-center justify-center gap-5 mt-1">
            <!-- Call Back (green phone) -->
            <button id="btn-callback" type="button" data-action="call.callback"
                class="w-9 h-9 rounded-full bg-green-500 hover:bg-green-600 flex items-center justify-center transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                    class="text-white">
                    <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg>
            </button>
        </div>

        <!-- Send Message Button (Bottom) -->
        <div class="relative z-10 w-full flex justify-center mt-auto mb-1.5">
            <button type="button" data-action="call.send_message"
                class="px-4 py-1 rounded border border-white/40 text-[8px] font-medium text-white/80 hover:bg-white/10 hover:text-white transition-colors tracking-wide">
                Send Message
            </button>
        </div>

    </div>

</body>

</html>
