<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="m-0 h-screen w-full overflow-hidden bg-transparent">

    <!-- Card Container -->
    <div data-scarline-widget-root class="bg-transparent w-full h-full rounded-2xl p-6 shadow-2xl relative text-white">

        <!-- Top Section: Album Art & Info -->
        <div class="flex gap-5 mb-8">
            <!-- Album Art -->
            <div class="relative shrink-0">
                <img src="../../images/spotify-fromzero-cover.png" alt="Album Art"
                    class="w-32 h-32 rounded-2xl shadow-lg object-cover">
                <!-- Tiny icon overlay on album art from original image (optional detail, skipping for cleanliness or adding if critical) -->
            </div>

            <!-- Info & Spotify Icon -->
            <div class="flex-1 flex flex-col pt-1">
                <div class="flex justify-between items-start">
                    <div class="flex flex-col gap-0.5">
                        <h1 class="text-xl font-bold tracking-tight" data-bind="media.track_title">IGYEIH</h1>
                        <p class="text-zinc-300 font-medium" data-bind="media.artist">Linkin Park</p>
                        <p class="text-zinc-400 text-sm" data-bind="media.album">From Zero</p>
                    </div>
                    <!-- Spotify Icon -->
                    <svg viewBox="0 0 24 24" class="w-6 h-6 fill-white opacity-90" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="mb-8">
            <div class="flex items-center w-full group cursor-pointer">
                <!-- Played portion -->
                <div class="h-1 bg-blue-600 w-1/2 rounded-l-full relative" data-bind="media.progress_ratio"
                    data-bind-style="width" data-style-unit="%" data-bind-text="false">
                    <!-- Handle -->
                    <div
                        class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-3 h-3 bg-blue-600 border-2 border-white rounded-full shadow hover:scale-125 transition">
                    </div>
                </div>
                <!-- Remaining portion -->
                <div class="h-1 flex-1 bg-zinc-400/50 rounded-r-full"></div>
            </div>
            <div class="flex justify-between text-[11px] text-zinc-400 font-medium mt-2">
                <span data-bind="media.progress_label">1:34</span>
                <span data-bind="media.duration_label">3:29</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-between px-2">
            <!-- Shuffle -->
            <button type="button" data-action="media.shuffle"
                class="text-blue-500 hover:text-blue-400 transition relative group p-2 button-toggle"
                data-active="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="w-6 h-6">
                    <path d="M16 3h5v5"></path>
                    <path d="M4 20L21 3"></path>
                    <path d="M21 16v5h-5"></path>
                    <path d="M15 15l1 1"></path>
                    <path d="M4 4l5 5"></path>
                </svg>
                <!-- Dot -->
                <div class="dot absolute bottom-0 left-1/2 -translate-x-1/2 w-1 h-1 bg-blue-500 rounded-full"></div>
            </button>

            <!-- Previous -->
            <button type="button" data-action="media.previous"
                class="text-zinc-400 hover:text-white transition relative group p-2 button-toggle" data-active="false">
                <svg fill="currentColor" class="w-8 h-8" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
                <div class="dot absolute bottom-0 left-1/2 -translate-x-1/2 w-1 h-1 bg-blue-500 rounded-full hidden">
                </div>
            </button>

            <!-- Play/Pause -->
            <button type="button" data-action="media.play_pause"
                class="bg-white rounded-full p-4 hover:scale-105 transition shadow-lg shadow-black/20">
                <svg class="hidden w-8 h-8 fill-zinc-800" viewBox="0 0 24 24" data-bind="media.is_playing"
                    data-bind-class="inline-block" data-bind-class-false="hidden">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
                <svg class="w-8 h-8 fill-zinc-800" viewBox="0 0 24 24" data-bind="media.is_playing"
                    data-bind-class="hidden">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>

            <!-- Next -->
            <button type="button" data-action="media.next"
                class="text-zinc-400 hover:text-white transition relative group p-2 button-toggle" data-active="false">
                <svg fill="currentColor" class="w-8 h-8" viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
                <div class="dot absolute bottom-0 left-1/2 -translate-x-1/2 w-1 h-1 bg-blue-500 rounded-full hidden">
                </div>
            </button>

            <!-- Repeat -->
            <button type="button" data-action="media.repeat"
                class="text-zinc-400 hover:text-white transition relative group p-2 button-toggle" data-active="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="w-6 h-6">
                    <polyline points="17 1 21 5 17 9"></polyline>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
                <div class="dot absolute bottom-0 left-1/2 -translate-x-1/2 w-1 h-1 bg-blue-500 rounded-full hidden">
                </div>
            </button>
        </div>

    </div>
    <script src="../../widget-runtime.js"></script>
</body>

</html>
