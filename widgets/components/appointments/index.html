<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
        }

        /* Custom Grid Background - matched to other widgets */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        .calendar-strip {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
        }

        .day-label {
            font-size: 6px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.02em;
            margin-bottom: 2px;
        }

        .date-item {
            font-size: 8px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .active-date {
            background-color: #3b82f6;
            /* Blue-500 */
            color: white;
            border-radius: 4px;
            width: 14px;
            height: 14px;
            margin: auto;
        }

        .selected-underline::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 1.5px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 1px;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 2px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="bg-transparent min-h-screen flex items-center justify-center p-4">

    <!-- Card Container: 150x129 -->
    <div
        class="bg-transparent w-[150px] h-[197px] rounded-lg overflow-hidden shadow-lg relative text-white flex flex-col p-2 isolate">



        <!-- Header -->
        <div class="relative z-10 flex items-start justify-between px-1 mt-0.5">
            <div class="flex items-start gap-1.5">
                <div class="text-[22px] font-bold leading-none tracking-tighter" data-bind="calendar.date_label">11
                </div>
                <div class="flex flex-col">
                    <div class="flex items-center gap-1">
                        <span class="text-[11px] font-semibold leading-none"
                            data-bind="calendar.month_label">February</span>
                        <span class="text-[8px] font-medium text-white/30 leading-none"
                            data-bind="calendar.year_label">2026</span>
                    </div>
                    <div class="text-[7.5px] font-medium text-white/40 mt-1 leading-none">
                        <span data-bind="calendar.today_label">Today</span>, <span
                            data-bind="calendar.weekday_label">Saturday</span>
                    </div>
                </div>
            </div>
            <button type="button" data-action="calendar.add_event"
                class="text-white/40 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- Horizontal Week Strip -->
        <div class="relative z-10 mt-2.5">
            <div class="calendar-strip">
                <div class="day-label">MON</div>
                <div class="day-label">TUE</div>
                <div class="day-label">WED</div>
                <div class="day-label">THU</div>
                <div class="day-label">FRI</div>
                <div class="day-label">SAT</div>
                <div class="day-label">SUN</div>
            </div>
            <div class="calendar-strip mt-0.5">
                <div class="date-item">6</div>
                <div class="date-item">7</div>
                <div class="date-item">8</div>
                <div class="date-item selected-underline">9</div>
                <div class="date-item">10</div>
                <div class="date-item">
                    <div class="active-date flex items-center justify-center" data-bind="calendar.date_label">11</div>
                </div>
                <div class="date-item">12</div>
            </div>
        </div>

        <!-- Appointments List (Scrollable) -->
        <div class="relative z-10 mt-3 flex-1 overflow-y-auto px-0.5 space-y-2.5 custom-scrollbar">
            <!-- Team Lunch -->
            <div class="flex items-start gap-2.5 group cursor-pointer">
                <div class="w-0.5 h-6 bg-blue-500 rounded-full shrink-0 mt-0.5"></div>
                <div class="flex flex-col">
                    <div class="text-[7.5px] font-medium text-white/40 leading-none" data-bind="calendar.event_1_time">
                        12:30 – 14:00 PM</div>
                    <div class="text-[9px] font-semibold text-white/90 mt-0.5 leading-tight group-hover:text-white transition-colors"
                        data-bind="calendar.event_1_title">
                        Team Lunch</div>
                </div>
            </div>

            <!-- Client Meeting -->
            <div class="flex items-start gap-2.5 group cursor-pointer">
                <div class="w-0.5 h-6 bg-red-500 rounded-full shrink-0 mt-0.5"></div>
                <div class="flex flex-col">
                    <div class="text-[7.5px] font-medium text-white/40 leading-none" data-bind="calendar.event_2_time">
                        4:00 – 6:00 PM</div>
                    <div class="text-[9px] font-semibold text-white/90 mt-0.5 leading-tight group-hover:text-white transition-colors"
                        data-bind="calendar.event_2_title">
                        Client Meeting</div>
                </div>
            </div>

            <!-- Grocery Shopping -->
            <div class="flex items-start gap-2.5 group cursor-pointer">
                <div class="w-0.5 h-6 bg-green-500 rounded-full shrink-0 mt-0.5"></div>
                <div class="flex flex-col">
                    <div class="text-[7.5px] font-medium text-white/40 leading-none" data-bind="calendar.event_3_time">
                        6:30 – 7:30 PM</div>
                    <div class="text-[9px] font-semibold text-white/90 mt-0.5 leading-tight group-hover:text-white transition-colors"
                        data-bind="calendar.event_3_title">
                        Grocery Shopping</div>
                </div>
            </div>

            <!-- Gym Session -->
            <div class="flex items-start gap-2.5 group cursor-pointer">
                <div class="w-0.5 h-6 bg-yellow-400 rounded-full shrink-0 mt-0.5"></div>
                <div class="flex flex-col">
                    <div class="text-[7.5px] font-medium text-white/40 leading-none" data-bind="calendar.event_4_time">
                        8:00 – 9:00 PM</div>
                    <div class="text-[9px] font-semibold text-white/90 mt-0.5 leading-tight group-hover:text-white transition-colors"
                        data-bind="calendar.event_4_title">
                        Gym Session</div>
                </div>
            </div>
        </div>

    </div>


    <script>
        (function initSCARlineWidget() {
            const WIDGET_RUNTIME_MARKER = 'scarline-widget-runtime';

            function formatValue(element, value) {
                if (value === undefined || value === null) return null;
                if (element?.dataset?.format === 'number') {
                    const decimals = Number(element.dataset.decimals ?? '0');
                    const numeric = Number(value);
                    if (!Number.isNaN(numeric)) {
                        return numeric.toFixed(decimals);
                    }
                }
                return String(value);
            }

            function toggleClassTokens(element, classNames, enabled) {
                const tokens = String(classNames ?? '')
                    .split(/\s+/)
                    .map((token) => token.trim())
                    .filter(Boolean);
                if (tokens.length === 0) return;
                if (enabled) {
                    element.classList.add(...tokens);
                } else {
                    element.classList.remove(...tokens);
                }
            }

            function applyBinding(key, value) {
                document.querySelectorAll('[data-bind]').forEach((element) => {
                    if (element.dataset.bind !== key) return;

                    if (element.dataset.bindClass) {
                        const className = element.dataset.bindClass;
                        const falseClassName = element.dataset.bindClassFalse;
                        if (value) {
                            toggleClassTokens(element, className, true);
                            if (falseClassName) toggleClassTokens(element, falseClassName, false);
                        } else {
                            toggleClassTokens(element, className, false);
                            if (falseClassName) toggleClassTokens(element, falseClassName, true);
                        }
                    }

                    if (element.dataset.bindStyle) {
                        const styleName = element.dataset.bindStyle;
                        const unit = element.dataset.styleUnit ?? '';
                        element.style.setProperty(styleName, `${value}${unit}`);
                    }

                    if (element.dataset.bindAttr) {
                        const attrName = element.dataset.bindAttr;
                        const formatted = formatValue(element, value);
                        if (formatted !== null) element.setAttribute(attrName, formatted);
                    }

                    if (element.dataset.bindText !== 'false') {
                        const formatted = formatValue(element, value);
                        if (formatted !== null) element.textContent = formatted;
                    }
                });
            }

            function setVisualState(nextState) {
                const root = document.body.firstElementChild;
                if (!root) return;
                root.dataset.state = nextState;
                root.style.opacity = nextState === 'hidden' ? '0' : '1';
                root.style.filter = nextState === 'highlighted' ? 'drop-shadow(0 0 24px rgba(56, 189, 248, 0.85))' : 'none';
                root.style.transform = nextState === 'highlighted' ? 'scale(1.015)' : 'scale(1)';
                root.style.transition = 'opacity 180ms ease, filter 180ms ease, transform 180ms ease';
            }

            function bindWidget() {
                if (!window.SCARline || document.body.dataset[WIDGET_RUNTIME_MARKER] === 'ready') {
                    return;
                }
                document.body.dataset[WIDGET_RUNTIME_MARKER] = 'ready';

                const keys = [...new Set(
                    Array.from(document.querySelectorAll('[data-bind]'))
                        .map((element) => element.dataset.bind)
                        .filter(Boolean)
                )];

                keys.forEach((key) => {
                    window.SCARline.onBinding(key, (value) => applyBinding(key, value));
                    const currentValue = window.SCARline.getBinding(key);
                    if (typeof currentValue !== 'undefined') {
                        applyBinding(key, currentValue);
                    }
                });

                document.querySelectorAll('[data-action]').forEach((element) => {
                    element.addEventListener('click', () => {
                        const action = element.dataset.action;
                        if (!action) return;
                        window.SCARline.send(action, {
                            action,
                            label: element.textContent?.trim() || null
                        });
                    });
                });

                window.SCARline.onTrigger((event) => {
                    const bindingValues = event?.bindingValues ?? event?.payload?.bindingValues ?? {};
                    Object.entries(bindingValues).forEach(([key, value]) => applyBinding(key, value));
                    if (event?.action === 'highlight') {
                        setVisualState('highlighted');
                    } else if (event?.action === 'hide') {
                        setVisualState('hidden');
                    } else if (event?.action === 'show' || event?.action === 'reset') {
                        setVisualState('visible');
                    }
                });

                window.SCARline.onStateChange((state) => {
                    setVisualState(state);
                });

                window.SCARline.ready();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bindWidget, { once: true });
            } else {
                bindWidget();
            }
        })();
    </script>
</body>

</html>
