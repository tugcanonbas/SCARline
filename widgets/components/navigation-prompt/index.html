<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigation Prompt</title>
  <link rel="stylesheet" href="../../dist.css" />
  <style>
    body { font-family: "Inter", sans-serif; background: transparent; }
  </style>
</head>
<body class="m-0 h-screen w-full overflow-hidden bg-transparent">
  <section data-scarline-widget-root class="w-full h-full rounded-2xl border border-sky-400/20 bg-[#0b1620]/92 text-white shadow-2xl backdrop-blur-md p-5 flex flex-col justify-between">
    <div class="flex items-center justify-between">
      <div class="text-[11px] uppercase tracking-[0.22em] text-sky-300">Navigation</div>
      <div class="rounded-full border border-white/10 px-3 py-1 text-[10px] text-white/60" data-bind="navigation.route_label">Route A</div>
    </div>
    <div class="text-[23px] font-semibold leading-tight tracking-tight" data-bind="navigation.current_instruction">
      Keep right and prepare for the next junction.
    </div>
    <div class="text-sm text-white/65" data-bind="navigation.next_waypoint">Next waypoint: North gate</div>
  </section>
    <script src="../../widget-runtime.js"></script>
</body>
</html>
