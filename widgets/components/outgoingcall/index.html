<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outgoing Call</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background - Scaled down pattern */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        /* Pulsing animation for the calling indicator */
        @keyframes pulse-dot {

            0%,
            80%,
            100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }
        }

        .dot-1 {
            animation: pulse-dot 1.4s infinite 0s;
        }

        .dot-2 {
            animation: pulse-dot 1.4s infinite 0.2s;
        }

        .dot-3 {
            animation: pulse-dot 1.4s infinite 0.4s;
        }
    </style>
</head>

<body class="bg-transparent min-h-screen flex items-center justify-center p-4">

    <!-- Card Container: 150x197 -->
    <div
        class="bg-transparent w-[150px] h-[197px] rounded-lg overflow-hidden shadow-md relative text-white flex flex-col items-center p-1 isolate">



        <!-- Caller Info (Top) -->
        <div class="relative z-10 flex flex-col items-center mt-1 w-full">
            <!-- Avatar -->
            <div class="w-12 h-12 rounded-full overflow-hidden mb-1">
                <img id="caller-avatar" src="../../images/avatars/susan-smith.png" alt="Caller"
                    class="w-full h-full object-cover">
            </div>
            <!-- Name -->
            <div id="caller-name" class="text-[12px] font-semibold tracking-tight text-white leading-tight"
                data-bind="call.caller_name">
                Susan Smith
            </div>
            <!-- Phone Number -->
            <div id="caller-phone" class="text-[9px] font-medium text-white/50 tracking-wide mt-0.5"
                data-bind="call.caller_phone">
                +49 1234 567890
            </div>
            <!-- Calling text with animated dots -->
            <div class="text-[8px] font-medium text-white/50 tracking-wide mt-1 flex items-center gap-0">
                <span data-bind="call.status_label">Calling</span><span class="dot-1">.</span><span
                    class="dot-2">.</span><span class="dot-3">.</span>
            </div>
            <!-- Call timer -->
            <div id="call-timer" class="text-[9px] font-medium text-white/60 tracking-wide"
                data-bind="call.duration_label">
                00:00
            </div>
            <div class="text-[7px] font-medium text-white/45 tracking-wide text-center px-3"
                data-bind="call.note_label">
                Waiting for answer
            </div>
        </div>

        <!-- Hang Up Button -->
        <div class="relative z-10 flex items-center justify-center gap-5 mt-1">
            <button id="btn-hangup" type="button" data-action="call.hangup"
                class="w-9 h-9 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                    class="text-white">
                    <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                        transform="rotate(135 12 12)" />
                </svg>
            </button>
        </div>

        <!-- Send Message Button (Bottom) -->
        <div class="relative z-10 w-full flex justify-center mt-auto mb-1.5">
            <button type="button" data-action="call.send_message"
                class="px-4 py-1 rounded border border-white/40 text-[8px] font-medium text-white/80 hover:bg-white/10 hover:text-white transition-colors tracking-wide">
                Send Message
            </button>
        </div>

    </div>
    <script src="../../widget-runtime.js"></script>
</body>

</html>
