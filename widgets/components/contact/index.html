<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background - Scaled down pattern */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>

<body class="bg-transparent min-h-screen flex items-center justify-center p-4">

    <!-- Card Container: 150x197 -->
    <div
        class="bg-transparent w-[150px] h-[197px] rounded-lg overflow-hidden shadow-md relative text-white flex flex-col isolate">



        <!-- Back Button -->
        <button type="button" class="absolute top-2 left-2 z-20 text-white/70 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>

        <!-- Contact Info -->
        <div class="relative z-10 flex flex-col items-center mt-2 w-full">
            <!-- Avatar -->
            <div class="w-14 h-14 rounded-full overflow-hidden mb-1">
                <img id="contact-avatar" src="../../images/avatars/susan-smith.png" alt="Contact"
                    class="w-full h-full object-cover">
            </div>
            <!-- Name -->
            <div id="contact-name" class="text-[12px] font-semibold tracking-tight text-white leading-tight"
                data-bind="contact.name">
                Susan Smith
            </div>
            <!-- Phone Number -->
            <div id="contact-phone" class="text-[9px] font-medium text-white/50 tracking-wide mt-0.5"
                data-bind="contact.phone">
                +49 1234 567890
            </div>
        </div>

        <!-- Call / Message Buttons -->
        <div class="relative z-10 flex items-center justify-center gap-4 mt-2">
            <!-- Call Button -->
            <button id="btn-call" type="button" data-action="contact.call"
                class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-white">
                    <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg>
            </button>
            <!-- Message Button -->
            <button type="button" data-action="contact.message"
                class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-white">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </button>
        </div>

        <!-- Address -->
        <div class="relative z-10 flex items-start gap-1.5 px-3 mt-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-white/50 mt-0.5 flex-shrink-0">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
            </svg>
            <div class="text-[7px] font-medium text-white/50 leading-tight">
                <span data-bind="contact.company">SCARline Lab</span><br><span
                    data-bind="contact.email">susan.smith@scarline.dev</span>
            </div>
        </div>

        <!-- Navigate Button -->
        <div class="relative z-10 w-full flex justify-center mt-auto mb-1.5">
            <button
                class="px-4 py-1 rounded border border-white/40 text-[8px] font-medium text-white/80 hover:bg-white/10 hover:text-white transition-colors tracking-wide">
                Navigate
            </button>
        </div>

    </div>
    <script src="../../widget-runtime.js"></script>
</body>

</html>
