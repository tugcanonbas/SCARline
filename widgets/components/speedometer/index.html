<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background - Scaled down pattern */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        .gauge-progress {
            transition: stroke-dashoffset 0.3s ease-out;
        }
    </style>
</head>

<body class="bg-transparent min-h-screen flex items-center justify-center p-4">

    <!-- Card Container: 150x129 -->
    <div
        class="bg-transparent w-[150px] h-[129px] rounded-lg overflow-hidden shadow-md relative text-white flex flex-col items-center justify-center p-2 isolate">

        <!-- Grid Background Overlay -->
        <!-- <div class="absolute inset-0 bg-grid pointer-events-none opacity-50 z-0"></div> -->

        <!-- Gauge SVG -->
        <div class="absolute inset-0 z-0 flex items-center justify-center mt-2">
            <svg class="w-[120px] h-[120px]" viewBox="0 0 100 100">
                <!-- Track -->
                <path d="M 21.72 78.28 A 40 40 0 1 1 78.28 78.28" fill="none" stroke="rgba(255,255,255,0.1)"
                    stroke-width="6" stroke-linecap="round" />

                <!-- Progress (example value 132/220) -->
                <path d="M 21.72 78.28 A 40 40 0 1 1 78.28 78.28" fill="none" stroke="#0ea5e9" stroke-width="6"
                    stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="75.4"
                    class="gauge-progress drop-shadow-[0_0_4px_rgba(14,165,233,0.5)]"
                    data-bind="vehicle.speed_arc_offset" data-bind-attr="stroke-dashoffset" data-bind-text="false"
                    data-format="number" data-decimals="1" />
            </svg>
        </div>

        <!-- Speed Value -->
        <div class="relative z-10 flex flex-col items-center mt-4">
            <div class="text-[38px] font-bold leading-none tracking-tight" data-bind="vehicle.speed"
                data-format="number" data-decimals="0">
                132
            </div>
            <div class="text-[9px] font-medium text-white/60 tracking-wider uppercase mt-1"
                data-bind="vehicle.speed_unit">
                km/h
            </div>
        </div>

        <!-- Ticks/Scale decorative elements -->
        <div class="absolute bottom-3 w-full flex justify-between px-5 text-[8px] text-white/40 font-medium">
            <span data-bind="vehicle.speed_ratio" data-format="number" data-decimals="0">60</span>
            <span>0</span>
            <span data-bind="vehicle.speed_limit" data-format="number" data-decimals="0">220</span>
        </div>

    </div>


<script>
(function initSCARlineWidget() {
    const WIDGET_RUNTIME_MARKER = 'scarline-widget-runtime';

    function formatValue(element, value) {
        if (value === undefined || value === null) return null;
        if (element?.dataset?.format === 'number') {
            const decimals = Number(element.dataset.decimals ?? '0');
            const numeric = Number(value);
            if (!Number.isNaN(numeric)) {
                return numeric.toFixed(decimals);
            }
        }
        return String(value);
    }

    function toggleClassTokens(element, classNames, enabled) {
        const tokens = String(classNames ?? '')
            .split(/\s+/)
            .map((token) => token.trim())
            .filter(Boolean);
        if (tokens.length === 0) return;
        if (enabled) {
            element.classList.add(...tokens);
        } else {
            element.classList.remove(...tokens);
        }
    }

    function applyBinding(key, value) {
        document.querySelectorAll('[data-bind]').forEach((element) => {
            if (element.dataset.bind !== key) return;

            if (element.dataset.bindClass) {
                const className = element.dataset.bindClass;
                const falseClassName = element.dataset.bindClassFalse;
                if (value) {
                    toggleClassTokens(element, className, true);
                    if (falseClassName) toggleClassTokens(element, falseClassName, false);
                } else {
                    toggleClassTokens(element, className, false);
                    if (falseClassName) toggleClassTokens(element, falseClassName, true);
                }
            }

            if (element.dataset.bindStyle) {
                const styleName = element.dataset.bindStyle;
                const unit = element.dataset.styleUnit ?? '';
                element.style.setProperty(styleName, `${value}${unit}`);
            }

            if (element.dataset.bindAttr) {
                const attrName = element.dataset.bindAttr;
                const formatted = formatValue(element, value);
                if (formatted !== null) element.setAttribute(attrName, formatted);
            }

            if (element.dataset.bindText !== 'false') {
                const formatted = formatValue(element, value);
                if (formatted !== null) element.textContent = formatted;
            }
        });
    }

    function setVisualState(nextState) {
        const root = document.body.firstElementChild;
        if (!root) return;
        root.dataset.state = nextState;
        root.style.opacity = nextState === 'hidden' ? '0' : '1';
        root.style.filter = nextState === 'highlighted' ? 'drop-shadow(0 0 24px rgba(56, 189, 248, 0.85))' : 'none';
        root.style.transform = nextState === 'highlighted' ? 'scale(1.015)' : 'scale(1)';
        root.style.transition = 'opacity 180ms ease, filter 180ms ease, transform 180ms ease';
    }

    function bindWidget() {
        if (!window.SCARline || document.body.dataset[WIDGET_RUNTIME_MARKER] === 'ready') {
            return;
        }
        document.body.dataset[WIDGET_RUNTIME_MARKER] = 'ready';

        const keys = [...new Set(
            Array.from(document.querySelectorAll('[data-bind]'))
                .map((element) => element.dataset.bind)
                .filter(Boolean)
        )];

        keys.forEach((key) => {
            window.SCARline.onBinding(key, (value) => applyBinding(key, value));
            const currentValue = window.SCARline.getBinding(key);
            if (typeof currentValue !== 'undefined') {
                applyBinding(key, currentValue);
            }
        });

        document.querySelectorAll('[data-action]').forEach((element) => {
            element.addEventListener('click', () => {
                const action = element.dataset.action;
                if (!action) return;
                window.SCARline.send(action, {
                    action,
                    label: element.textContent?.trim() || null
                });
            });
        });

        window.SCARline.onTrigger((event) => {
            const bindingValues = event?.bindingValues ?? event?.payload?.bindingValues ?? {};
            Object.entries(bindingValues).forEach(([key, value]) => applyBinding(key, value));
            if (event?.action === 'highlight') {
                setVisualState('highlighted');
            } else if (event?.action === 'hide') {
                setVisualState('hidden');
            } else if (event?.action === 'show' || event?.action === 'reset') {
                setVisualState('visible');
            }
        });

        window.SCARline.onStateChange((state) => {
            setVisualState(state);
        });

        window.SCARline.ready();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindWidget, { once: true });
    } else {
        bindWidget();
    }
})();
</script>
</body>

</html>
