<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Notes</title>
  <link rel="stylesheet" href="../../dist.css" />
  <style>
    body { font-family: "Inter", sans-serif; background: transparent; }
  </style>
</head>
<body class="m-0 h-screen w-full overflow-hidden bg-transparent">
  <section data-scarline-widget-root class="w-full h-full rounded-2xl border border-white/10 bg-[#11151a]/92 text-white shadow-2xl backdrop-blur-md p-5 flex flex-col justify-between">
    <div class="text-[11px] uppercase tracking-[0.22em] text-white/45" data-bind="notes.title">Operator Notes</div>
    <div class="text-[15px] leading-relaxed text-white/85" data-bind="notes.body">
      Use this surface for live annotations, reminders, or participant observations.
    </div>
    <div class="text-xs text-white/50" data-bind="notes.footer">Preview layout</div>
  </section>
    <script src="../../widget-runtime.js"></script>
</body>
</html>
