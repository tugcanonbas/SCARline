<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar</title>
    <link rel="stylesheet" href="../../dist.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Grid Background - Scaled down pattern */
        .bg-grid {
            background-size: 10px 10px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>

<body class="bg-transparent min-h-screen flex items-center justify-center p-4">

    <!-- Card Container: 150x129 -->
    <div
        class="bg-transparent w-[150px] h-[129px] rounded-lg overflow-hidden shadow-md relative text-white flex flex-col items-center justify-center p-2 isolate">



        <!-- Profile Switch Button -->
        <button type="button" data-action="participant.switch_profile"
            class="absolute top-2 right-2 p-1.5 text-white/40 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>

        <!-- Avatar Image -->
        <div class="relative z-10 w-[68px] h-[68px] rounded-full overflow-hidden mb-2">
            <img src="../../images/avatars/susan-smith.png" alt="User Avatar" class="w-full h-full object-cover" />
        </div>

        <!-- User Name/Label -->
        <div class="relative z-10 text-center">
            <div class="text-sm font-semibold tracking-tight text-white/90" data-bind="participant.name">
                Susan Smith
            </div>
            <div class="text-[9px] font-medium text-white/50 tracking-wide" data-bind="participant.role">
                Participant
            </div>
            <span class="sr-only" data-bind="participant.status">Drive Phase 2</span>
        </div>

    </div>
    <script src="../../widget-runtime.js"></script>
</body>

</html>
