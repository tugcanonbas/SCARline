<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Instruction</title>
  <link rel="stylesheet" href="../../dist.css" />
  <style>
    body { font-family: "Inter", sans-serif; background: transparent; }
  </style>
</head>
<body class="m-0 min-h-screen bg-transparent flex items-start justify-start">
  <section class="w-[316px] h-[129px] rounded-2xl border border-emerald-400/15 bg-[#0c1914]/92 text-white shadow-2xl backdrop-blur-md p-5 flex flex-col justify-between">
    <div class="text-[11px] uppercase tracking-[0.22em] text-emerald-300" data-bind="study.title">Current Task</div>
    <div class="text-[21px] font-semibold leading-tight tracking-tight" data-bind="study.current_prompt">
      Maintain lane position and keep your speed within the posted limit.
    </div>
    <div class="text-sm text-white/60" data-bind="study.helper_text">Follow the scenario until the next researcher cue.</div>
  </section>
</body>
</html>
