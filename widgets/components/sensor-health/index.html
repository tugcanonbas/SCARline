<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Health</title>
  <link rel="stylesheet" href="../../dist.css" />
  <style>
    body { font-family: "Inter", sans-serif; background: transparent; }
  </style>
</head>
<body class="m-0 min-h-screen bg-transparent flex items-start justify-start">
  <section class="w-[316px] h-[197px] rounded-2xl border border-amber-300/15 bg-[#17130f]/92 text-white shadow-2xl backdrop-blur-md p-5 flex flex-col">
    <div class="flex items-start justify-between gap-4">
      <div>
        <div class="text-[11px] uppercase tracking-[0.22em] text-amber-200">Sensor Health</div>
        <div class="mt-2 text-[24px] font-semibold leading-none" data-bind="sensor.streaming_label">3/4 sensors streaming</div>
      </div>
      <div class="rounded-full border border-white/10 px-3 py-1 text-[11px] text-white/60" data-bind="sensor.issue_label">No issues detected</div>
    </div>
    <div class="mt-5 grid gap-3">
      <div class="rounded-xl border border-white/8 bg-white/5 px-4 py-3 text-sm" data-bind="sensor.summary_1">Front Camera · streaming</div>
      <div class="rounded-xl border border-white/8 bg-white/5 px-4 py-3 text-sm" data-bind="sensor.summary_2">GNSS · streaming</div>
      <div class="rounded-xl border border-white/8 bg-white/5 px-4 py-3 text-sm" data-bind="sensor.summary_3">IMU · degraded</div>
    </div>
  </section>
</body>
</html>
