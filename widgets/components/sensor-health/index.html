<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Health</title>
  <link rel="stylesheet" href="../../dist.css" />
  <style>
    body { font-family: "Inter", sans-serif; background: transparent; }
  </style>
</head>
<body class="m-0 h-screen w-full overflow-hidden bg-transparent">
  <section data-scarline-widget-root class="w-full h-full rounded-2xl border border-amber-300/15 bg-[#17130f]/92 text-white shadow-2xl backdrop-blur-md p-3 flex flex-col">
    <div class="shrink-0">
      <div class="min-w-0">
        <div class="text-[11px] uppercase tracking-[0.22em] text-amber-200">Sensor Health</div>
        <div class="mt-1 text-sm font-semibold leading-tight" data-bind="sensor.streaming_label">—</div>
      </div>
      <div class="mt-1 text-[11px] text-white/60" data-bind="sensor.issue_label">—</div>
    </div>
    <div class="mt-2 min-h-0 overflow-y-auto grid gap-1">
      <div class="rounded-lg border border-white/8 bg-white/5 px-2 py-1 text-[11px] break-words" data-bind="sensor.summary_1">—</div>
      <div class="rounded-lg border border-white/8 bg-white/5 px-2 py-1 text-[11px] break-words" data-bind="sensor.summary_2">—</div>
      <div class="rounded-lg border border-white/8 bg-white/5 px-2 py-1 text-[11px] break-words whitespace-pre-line" data-bind="sensor.summary_3">—</div>
    </div>
  </section>
    <script src="../../widget-runtime.js"></script>
</body>
</html>
