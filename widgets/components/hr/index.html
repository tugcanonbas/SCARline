<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Heart Rate Indicator</title>
    <link rel="stylesheet" href="../../dist.css" />
</head>

<body class="p-2">
    <div class="widget-surface px-4 py-3 min-w-[220px] flex flex-col gap-1">
        <div class="flex items-center justify-between">
            <span class="widget-title uppercase">Heart Rate</span>
            <span class="text-[10px] tracking-wide text-slate-400">Live</span>
        </div>

        <div class="flex items-baseline gap-1">
            <span class="text-3xl font-bold text-[color:var(--color-brand-primary)]">
                0
            </span>
            <span class="text-[11px] text-slate-500" data-bindings="unit">bpm</span>
        </div>
        <p class="widget-body mt-1">
            Current heart rate from simulation runtime.
        </p>
    </div>
</body>

</html>
