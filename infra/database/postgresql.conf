# SCARline PostgreSQL configuration overrides
# This file is mounted into the container and loaded via the command directive.
# Only add configuration that diverges from PostgreSQL 15 defaults.

# ── Diagnostics: pg_stat_statements ──────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 1000

# ── Defaults required by the postgres:15 image ──────────
# These must be present when overriding config_file or the
# container will not start (data directory, listen address).
listen_addresses = '*'
