server {
  listen 80;
  server_name _;
  absolute_redirect off;

  location = / {
    return 302 /admin/dashboard;
  }

  location = /favicon.ico {
    proxy_pass http://admin-panel:3000/admin/favicon.ico;
    proxy_set_header Host $host;
  }

  location = /apple-touch-icon.png {
    proxy_pass http://admin-panel:3000/admin/apple-touch-icon.png;
    proxy_set_header Host $host;
  }

  location = /apple-touch-icon-precomposed.png {
    proxy_pass http://admin-panel:3000/admin/apple-touch-icon-precomposed.png;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://core-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass http://core-api:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  location /overlay/ {
    proxy_pass http://overlay-web:4000/;
    proxy_set_header Host $host;
  }

  location /docs/ {
    proxy_pass http://docs:4040/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  location = /docs {
    return 308 /docs/;
  }

  location /rabbitmq/ {
    proxy_pass http://rabbitmq:15672/;
    proxy_set_header Host $host;
  }

  location ~ ^/(dashboard|startup|onboarding|login|user-studies|settings|documentation|researchers|session-logs|exports)(/.*)?$ {
    return 308 /admin$request_uri;
  }

  location /admin/ {
    proxy_pass http://admin-panel:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    return 404;
  }
}
